name = "dracula"

[colors]
prompt = "#50fa7b"
command = "#f8f8f2"
branch = "#bd93f9"
ahead = "#f1fa8c"
behind = "#ff5555"
staged = "#50fa7b"
modified = "#ffb86c"
untracked = "#6272a4"
path = "#8be9fd"
dim = "#6272a4"
# per-state colors
added = "#50fa7b"
deleted = "#ff5555"
renamed = "#8be9fd"
copied = "#8be9fd"
typechange = "#ffb86c"
conflict = "#ff5555"
# npm outdated severity ramp
major = "#ff5555"
minor = "#ffb86c"
patch = "#8be9fd"
update = "#bd93f9"
# state-list buckets
ok = "#50fa7b"
warn = "#f1fa8c"
bad = "#ff5555"
unknown = "#6272a4"

[glyphs]
prompt = "❯"
branch = "⎇"
ahead = "↑"
behind = "↓"
staged = "✓"
modified = "●"
added = "✚"
deleted = "✗"
renamed = "»"
copied = "⊕"
typechange = "~"
changed = "•"
untracked = "?"
clean = "✓"
conflict = "≠"
major = "▲"
minor = "◆"
patch = "▪"
update = "↑"
ok = "●"
warn = "◐"
bad = "✗"
unknown = "○"

[layout]
indent = "  "
label_width = 10
