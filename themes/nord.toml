name = "nord"

[colors]
prompt = "#a3be8c"
command = "#eceff4"
branch = "#b48ead"
ahead = "#ebcb8b"
behind = "#bf616a"
staged = "#a3be8c"
modified = "#ebcb8b"
untracked = "#4c566a"
path = "#81a1c1"
dim = "#4c566a"
# per-state colors
added = "#a3be8c"
deleted = "#bf616a"
renamed = "#88c0d0"
copied = "#88c0d0"
typechange = "#d08770"
conflict = "#bf616a"
# npm outdated severity ramp
major = "#bf616a"
minor = "#d08770"
patch = "#88c0d0"
update = "#b48ead"
# state-list buckets
ok = "#a3be8c"
warn = "#ebcb8b"
bad = "#bf616a"
unknown = "#4c566a"

[glyphs]
prompt = "❯"
branch = "⎇"
ahead = "↑"
behind = "↓"
staged = "✓"
modified = "●"
added = "✚"
deleted = "✗"
renamed = "»"
copied = "⊕"
typechange = "~"
changed = "•"
untracked = "?"
clean = "✓"
conflict = "≠"
major = "▲"
minor = "◆"
patch = "▪"
update = "↑"
ok = "●"
warn = "◐"
bad = "✗"
unknown = "○"

[layout]
indent = "  "
label_width = 10
